<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Complete file example</title>
  <style>
    html {
      font-family: sans-serif;
    }

    form {
      width: 600px;
      background: #ccc;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid black;
    }

    form ol {
      padding-left: 0;
    }

    form li, div > p {
      background: #eee;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      list-style-type: none;
      border: 1px solid black;
    }

    form img {
      height: 64px;
      order: 1;
    }

    form p {
      line-height: 32px;
      padding-left: 10px;
    }

    form label, form button {
      background-color: #7F9CCB;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px ridge black;
      font-size: 0.8rem;
      height: auto;
    }

    form label:hover, form button:hover {
      background-color: #2D5BA3;
      color: white;
    }

    form label:active, form button:active {
      background-color: #0D3F8F;
      color: white;
    }
  </style>
  </head>
<body>
  <form>
    <div>
      <label for="image_uploads">Choose images to upload (PNG, JPG)</label>
      <input type="file" id="image_uploads" name="image_uploads" accept=".jpg, .jpeg, .png" multiple>
    </div>
    <div class="preview">
      <p>No files currently selected for upload</p>
    </div>
	<div class="logger">
	</div>
    <div>
      <button class='button' type='button'>Submit</button>
    </div>
  </form>
  <script>
    const input = document.querySelector('input');
    const preview = document.querySelector('.preview');
	const button = document.querySelector('.button');
	
	button.addEventListener('click', buttonClick);

    input.style.opacity = 0;

    input.addEventListener('change', updateImageDisplay);

    async function updateImageDisplay() {
      while(preview.firstChild) {
        preview.removeChild(preview.firstChild);
      }

      const curFiles = input.files;
      if(curFiles.length === 0) {
        const para = document.createElement('p');
        para.textContent = 'No files currently selected for upload';
        preview.appendChild(para);
      } else {
        const list = document.createElement('ol');
        preview.appendChild(list);

        for(const file of curFiles) {
          const listItem = document.createElement('li');
          const para = document.createElement('p');

          if(validFileType(file)) {
            para.textContent = `File name ${file.name}, file size ${returnFileSize(file.size)}.`;
            const image = document.createElement('img');
            image.src = URL.createObjectURL(file);

            listItem.appendChild(image);
            listItem.appendChild(para);
			
			try {
				logStuff( "Before convert call");
				let t = await imageToBase64(file);
				logStuff( "After convert call")
			} catch( ee) {
				logStuff( "await catch")
				logStuff( ee)
			}
          } else {
            para.textContent = `File name ${file.name}: Not a valid file type. Update your selection.`;
            listItem.appendChild(para);
          }

          list.appendChild(listItem);
        }
      }
    }

// https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Image_types
    const fileTypes = [
        'image/apng',
        'image/bmp',
        'image/gif',
        'image/jpeg',
        'image/pjpeg',
        'image/png',
        'image/svg+xml',
        'image/tiff',
        'image/webp',
        `image/x-icon`
    ];

    function validFileType(file) {
      return fileTypes.includes(file.type);
    }

    function returnFileSize(number) {
      if(number < 1024) {
        return number + 'bytes';
      } else if(number > 1024 && number < 1048576) {
        return (number/1024).toFixed(1) + 'KB';
      } else if(number > 1048576) {
        return (number/1048576).toFixed(1) + 'MB';
      }
    }
	
	function imageToBase64(img) {
		logStuff( "begin convert func")
		return new Promise((resolve, reject) => {
		  const reader = new FileReader()
		  reader.onload = () => {
			logStuff( "success");
			logStuff( reader?.result?.length)
			resolve(reader.result ?? '')
		  }
		  reader.onerror = (event) => {
			logStuff( "Error");
			reject(event)
		  }
		  reader.onabort = () => {
			logStuff( "Abort");
			reject(null)
		  }
		  try {
			logStuff( "About to read");
			reader.readAsDataURL(img)
		  } catch (ee) {
			logStuff( "Exception")
			logStuff(ee)
			reject(null)
		  }
		  logStuff( "End convert func")
		})
	}
	
	function logStuff( t) {
		const logger = document.querySelector('.logger');
		const para = document.createElement('p');
        para.textContent = t;
        logger.appendChild(para);
	}
	
	const FFT_SIZE = 4096
	
	async function buttonClick() {
		let audioContext = undefined;
		let strean = undefined;
		try {
			let AudioCtor = window.AudioContext;
			if( !AudioCtor) {
				logStuff( 'No window.AudioContext');
				AudioCtor = window.webkitAudioContext;
				if( !AudioCtor) {
					logStuff( 'No window.webkitAudioContext');
					return;
				}
			}
			audioContext = new AudioCtor()
			logStuff( !!audioContext ? "audioContext ok" : "audioContext not ok")
			if( audioContext) {
				logStuff('About to resume')
				delay(1000);
				await audioContext.resume();
				logStuff( 'Resumed');
				
				stream = await navigator.mediaDevices.getUserMedia({
				  audio: {
					echoCancellation: false,
					noiseSuppression: false,
					autoGainControl: false,
					channelCount: { ideal: 1 }
				  },
				  video: false
				})
				logStuff( !!stream ? "Stream ok" : "stream not ok")
				
				const analyser = audioContext.createAnalyser()
				logStuff( !!analyser ? "Analyser ok" : "Analyser not ok")
				if( analyser) {
					analyser.fftSize = FFT_SIZE
					analyser.smoothingTimeConstant = 0.12
					analyser.minDecibels = -95
					analyser.maxDecibels = -20

					const source = audioContext.createMediaStreamSource(stream)
					logStuff( !!source ? "Source ok" : "Source not ok")
					if( source) {
						source.connect(analyser)
						delay(250);
					}
				}
			}
			logStuff( 'Done')
		} catch(ee) {
			logStuff( 'Button exception');
			logStuff( ee)
		} finally {
			stream?.getTracks().forEach((track) => track.stop())
			if (audioContext && audioContext.state !== 'closed') {
				await audioContext.close().catch(() => undefined)
			}
			logStuff( 'Finally')
		}
	}
	
	function delay(ms) {
		try {
			if( !window.setTimeout) {
				logStuff( "no timeout");
				return new Promise((resolve) => resolve());
			}
			return new Promise((resolve) => window.setTimeout(resolve, ms))
		} catch ( ee) {
			logStuff( 'delay exception')
			logStuff( ee);
		}
	}
	
  </script>
</body>
</html>
