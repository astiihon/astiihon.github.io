<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Customer Site</title><style>@layer base {
            svg {
              vertical-align:middle;
              display:block;
            }
          }</style><script defer="defer" src="picea.online.js"></script></head><body><div class="col-lg-8 mx-auto p-3 py-md-5"><header class="d-flex align-items-center pb-3 mb-5 border-bottom"><a href="/" class="d-flex align-items-center text-dark text-decoration-none"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="32" class="me-2" viewBox="0 0 118 94" role="img"><title>Bootstrap</title><path fill-rule="evenodd" clip-rule="evenodd" d="M24.509 0c-6.733 0-11.715 5.893-11.492 12.284.214 6.14-.064 14.092-2.066 20.577C8.943 39.365 5.547 43.485 0 44.014v5.972c5.547.529 8.943 4.649 10.951 11.153 2.002 6.485 2.28 14.437 2.066 20.577C12.794 88.106 17.776 94 24.51 94H93.5c6.733 0 11.714-5.893 11.491-12.284-.214-6.14.064-14.092 2.066-20.577 2.009-6.504 5.396-10.624 10.943-11.153v-5.972c-5.547-.529-8.934-4.649-10.943-11.153-2.002-6.484-2.28-14.437-2.066-20.577C105.214 5.894 100.233 0 93.5 0H24.508zM80 57.863C80 66.663 73.436 72 62.543 72H44a2 2 0 01-2-2V24a2 2 0 012-2h18.437c9.083 0 15.044 4.92 15.044 12.474 0 5.302-4.01 10.049-9.119 10.88v.277C75.317 46.394 80 51.21 80 57.863zM60.521 28.34H49.948v14.934h8.905c6.884 0 10.68-2.772 10.68-7.727 0-4.643-3.264-7.207-9.012-7.207zM49.948 49.2v16.458H60.91c7.167 0 10.964-2.876 10.964-8.281 0-5.406-3.903-8.178-11.425-8.178H49.948z" fill="currentColor"></path></svg> <span class="fs-4">Customer Site</span></a></header><main><h1>Picea Online Widget</h1><div class="mt-3 d-flex flex-wrap"><p></p><div>USER: <input id="un_input" value="cityuser@PCSA"/> PASSWORD: <input id="pw_input" type="password" value="-12345678"/> <button class="m-2 btn btn-primary btn-lg" onclick="clearCredentials()">Clear</button></div><p></p><p><button class="m-2 btn btn-primary btn-lg" onclick="demo0()">Run widget on modal, eComm, V1</button></p><p><button class="m-2 btn btn-primary btn-lg" onclick="demo1()">Run widget on modal, eComm, V2</button></p><p><button class="m-2 btn btn-primary btn-lg" onclick="demo3()">Run widget on modal, Mobile</button></p><button class="m-2 btn btn-secondary btn-lg" onclick="demo2()">Run widget on page</button><p><button id="resume_btn" class="m-2 btn btn-secondary btn-lg" onclick="restore()" disabled="disabled">Resume</button></p><p></p><div><button id="other_restore_btn" class="m-2 btn btn-secondary btn-lg" onclick="restore2()">Restore session</button> <input id="session_input"/></div><p></p><p></p><div><button id="ctrl_btn" class="m-2 btn btn-secondary btn-lg" onclick="controlTransaction()">Control transaction</button> Number: <input id="control_input" value=""/> Workflow: <input id="workflow_input" value="8394"/></div><p></p></div><div id="widget" class="row g-5"><div id="my-root" style="height: 300px; display: flex"></div></div><hr class="col-3 col-md-2 mb-5"/></main></div><script>let session_id = undefined
      function onTransactionCompleted(tx) {

        console.debug("Transaction Details", tx)
        session_id = tx?.data?.session_id;

        let btn = document.getElementById( "resume_btn");
        if( btn) {
          btn.disabled = !session_id;
        }

        if( tx.data && tx.signature) {
          const str = JSON.stringify(tx.data) + '76d9587e19957da29052bcde23de8d0ae0699732c4b5ac3936a2ba740cd0043a';
          let enc = new TextEncoder();
          const buf = enc.encode( str);
          window.crypto.subtle.digest( "SHA-256", buf).then( sig => {
            let s = (new Uint8Array( sig)).toHex();
            if( s === tx.signature.data) {
              console.log( "SIGNATURE OK")
            }
            else {
              console.log( s, tx.signature.data);
            }
          });
        }
        
        let output = ''
        for (const [key, value] of Object.entries(tx)) {
          const lb = output !== '' ? '\n' : ''
          output += `${lb}${key}: ${value}`
        }
        console.log('===output: ', output)

        if( tx?.data?.number) {
          const tInput = document.getElementById( "control_input");
          if( tInput) {
            tInput.value = tx.data.number;
          }
        }
      }

      const responseVersion = 1 | 2;
	  
      function getUsername() {
        let input = document.getElementById( "un_input");
        if( input?.value && '' !== input.value) {
          return input.value
        }
        return 'workflow@PCSA'
      }
      
      function getPassword() {
        let input = document.getElementById( "pw_input");
        if( input?.value && '' !== input.value) {
          return input.value
        }
        return 'fLTi4I44#PSFy*2S'
      }

      function clearCredentials() {
        let input = document.getElementById( "un_input");
        if( input)
          input.value = ''
        input = document.getElementById( "pw_input");
        if( input)
          input.value = ''
      }
	  

      function demo0() {
        picea.run({ user: getUsername(), password: getPassword(), mode: 0, responseVersion: 1, channelId: 2}, onTransactionCompleted)
      }
      function demo1() {
        picea.run({ user: getUsername(), password: getPassword(), mode: 0, responseVersion: 2, channelId: 2}, onTransactionCompleted)
      }
      function demo2() {
        picea.run({ user: getUsername(), password: getPassword(), element: 'my-root', mode: 0 })
      }
      function demo3() {
        picea.run({ user: getUsername(), password: getPassword(), mode: 0, responseVersion: 2, channelId: 3}, onTransactionCompleted)
      }
      function restore() {
        picea.restore({ user: getUsername(), password: getPassword(), mode: 0, responseVersion: 2}, onTransactionCompleted, session_id)
      }
      function restore2() {
        let input = document.getElementById( "session_input");
        const other_session_id = input?.value
        picea.restore({ user: getUsername(), password: getPassword(), mode: 0, responseVersion: 2}, onTransactionCompleted, other_session_id)
      }
      function controlTransaction() {
        const tInput = document.getElementById( "control_input");
        const wInput = document.getElementById( "workflow_input");
        const num = tInput?.value;
        let sid = 8394
        if( wInput.value ) {
          let tmp = Number.parseInt(wInput.value)
          if( !Number.isNaN( tmp) && 0 < tmp)
            sid = tmp;
        }
        picea.run({ user: getUsername(), password: getPassword(), mode: 0, responseVersion: 2, channelId: 2, autorun: sid, identifiers: { transaction_number: num}}, onTransactionCompleted)
      }</script></body></html>
